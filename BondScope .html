<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>BondScope — Invest in Bonds. Understand Your Returns.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root {
    --navy: #0B1F3A;
    --bg: #F7F8FA;
    --green: #1B7A4D;
    --slate: #5B7A9D;
    --bronze: #8A6D3B;
    --line: #E2E5EA;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: #1F2937;
    min-height: 100vh;
  }
  .mono { font-family: 'Spline Sans Mono', 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--slate); outline-offset: 2px; }
  a { color: inherit; }

  /* ---------- Nav ---------- */
  .nav {
    border-bottom: 1px solid var(--line);
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .brand { font-weight: 800; color: var(--navy); font-size: 17px; letter-spacing: -0.3px; }
  .nav-links { display: flex; gap: 4px; }
  .nav-btn {
    padding: 8px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
    border: none; cursor: pointer; background: transparent; color: #4B5563;
  }
  .nav-btn.active { background: var(--bg); color: var(--navy); }
  .nav-cta {
    padding: 9px 16px; border-radius: 8px; border: none; background: var(--navy);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Hero ---------- */
  .hero { padding: 56px 0 40px; text-align: center; }
  .eyebrow { font-size: 11px; font-weight: 700; color: var(--slate); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  .hero h1 { font-size: 36px; font-weight: 800; color: var(--navy); margin: 0; letter-spacing: -0.5px; line-height: 1.15; }
  .hero p { max-width: 520px; margin: 16px auto 0; color: #4B5563; font-size: 15px; line-height: 1.6; }
  .hero-cta {
    margin-top: 24px; padding: 13px 28px; border-radius: 10px; border: none;
    background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* ---------- Education cards ---------- */
  .section { margin-bottom: 44px; }
  .section h2 { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
  .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .edu-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .edu-card .title { font-size: 13.5px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .edu-card .body { font-size: 13px; color: #4B5563; line-height: 1.55; }

  .section-head-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .sample-tag { font-size: 12px; color: var(--muted); }
  .hint-line { font-size: 12.5px; color: var(--muted); margin-top: 4px; margin-bottom: 18px; }

  /* ---------- Bond cards ---------- */
  .bond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .bond-card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    transition: box-shadow .15s, transform .15s;
  }
  .bond-card:hover { box-shadow: 0 6px 20px rgba(11,31,58,0.08); transform: translateY(-2px); }
  .bond-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .bond-issuer { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .bond-type { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rating-badge {
    font-size: 12px; font-weight: 700; color: var(--bronze); border: 1px solid #8A6D3B55;
    background: #8A6D3B0D; border-radius: 6px; padding: 3px 8px; white-space: nowrap;
  }

  .ytm-row { display: flex; align-items: flex-end; gap: 2px; margin-top: 14px; margin-bottom: 2px; }
  .ytm-tick { width: 3px; height: 26px; background: var(--green); border-radius: 2px; margin-right: 8px; }
  .field-label { font-size: 11px; color: var(--muted); display: flex; align-items: center; }
  .ytm-value { font-size: 24px; font-weight: 700; color: var(--green); }

  .learn-more {
    background: none; border: none; color: var(--slate); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 0; margin-left: 6px; text-decoration: underline; text-underline-offset: 2px;
  }

  .field-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--line);
  }
  .field-value { font-size: 13.5px; font-weight: 600; color: #1F2937; margin-top: 2px; }

  .reason-box {
    margin-top: 14px; padding: 10px 12px; background: #1B7A4D0D; border-radius: 8px;
    font-size: 12.5px; color: #1B4D33; line-height: 1.5;
  }

  .card-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn-view {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--navy);
    background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-compare {
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    color: #374151; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-compare.active { border-color: var(--slate); background: #5B7A9D15; color: var(--slate); }

  /* ---------- Modals ---------- */
  .overlay {
    position: fixed; inset: 0; background: #0B1F3A66; display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .overlay.open { display: flex; }
  .overlay.bottom-sheet { align-items: flex-end; }

  .modal-detail {
    background: #fff; border-radius: 16px; max-width: 560px; width: 100%;
    max-height: 88vh; overflow-y: auto; padding: 28px;
  }
  .modal-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-issuer { font-size: 20px; font-weight: 700; color: var(--navy); }
  .modal-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .modal-hero-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-top: 22px;
    padding: 18px; background: var(--bg); border-radius: 12px;
  }
  .modal-hero-val { font-size: 22px; font-weight: 700; }

  .modal-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-top: 18px; }

  .disclaimer {
    margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-invest {
    flex: 1; padding: 12px; border-radius: 10px; border: none; background: var(--navy);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  .modal-glossary {
    background: #fff; border-radius: 16px 16px 0 0; max-width: 480px; width: 100%;
    padding: 24px 24px 32px; box-shadow: 0 -8px 30px rgba(11,31,58,0.15);
  }
  .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 20px; }
  .glossary-title { margin: 0; color: var(--navy); font-size: 18px; font-weight: 700; }
  .glossary-body { color: #374151; font-size: 14px; line-height: 1.6; margin-top: 12px; }
  .glossary-why { margin-top: 16px; padding: 12px 14px; background: var(--bg); border-radius: 10px; border-left: 3px solid var(--slate); }
  .glossary-why-label { font-size: 11px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .glossary-why-body { margin: 0; font-size: 13px; color: #374151; line-height: 1.6; }
  .btn-gotit {
    margin-top: 20px; width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* ---------- Profile screen ---------- */
  .profile-wrap { max-width: 640px; margin: 0 auto; padding: 48px 0; }
  .profile-wrap h1 { font-size: 26px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .profile-wrap > p { color: #4B5563; font-size: 14px; margin-bottom: 32px; }
  .field-block { margin-bottom: 24px; }
  .field-block-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 10px; }
  .radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .radio-btn {
    padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: #374151; font-weight: 500;
  }
  .radio-btn.selected { border-color: var(--navy); background: var(--navy); color: #fff; font-weight: 600; }
  .btn-submit {
    margin-top: 12px; width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #CBD2DB; color: #fff; font-size: 14px; font-weight: 600; cursor: not-allowed;
  }
  .btn-submit.enabled { background: var(--navy); cursor: pointer; }

  /* ---------- Result screen ---------- */
  .result-wrap { padding: 44px 0; }
  .result-card {
    max-width: 640px; margin: 0 auto 36px; background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 26px; text-align: center;
  }
  .result-pretext { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .result-profile { font-size: 26px; font-weight: 800; color: var(--navy); }
  .result-score { font-size: 13px; color: var(--slate); margin-top: 6px; }
  .alloc-box { margin-top: 16px; padding: 12px 16px; background: var(--bg); border-radius: 10px; }
  .alloc-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .alloc-value { font-size: 18px; font-weight: 700; color: var(--navy); margin-top: 4px; }
  .result-disclaimer { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.5; }

  .rec-head-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .rec-head-row h2 { font-size: 18px; font-weight: 700; color: var(--navy); margin: 0; }
  .compare-link { font-size: 13px; font-weight: 600; color: var(--slate); background: none; border: none; cursor: pointer; }

  /* ---------- Compare screen ---------- */
  .compare-wrap { padding: 44px 0; }
  .compare-wrap h1 { font-size: 24px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
  .compare-empty { padding: 80px 0; text-align: center; color: var(--muted); }
  .compare-empty .t1 { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
  .compare-empty .t2 { font-size: 13.5px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 32px; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; }
  th, td { padding: 12px 14px; text-align: left; }
  thead th {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  thead th.issuer-col { font-size: 12.5px; font-weight: 700; color: var(--navy); min-width: 150px; }
  .remove-btn { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; font-weight: 400; }
  tbody td { font-size: 12.5px; border-bottom: 1px solid var(--line); }
  tbody td.param-label { font-weight: 600; color: #374151; }
  tbody td.data-cell { font-weight: 500; color: #1F2937; }
  tbody td.data-cell.highlight { color: var(--green); font-weight: 700; }
  .hl-tag { font-size: 10px; margin-left: 6px; color: var(--muted); font-weight: 500; }
  tbody tr:nth-child(even) { background: var(--bg); }

  .return-viz h2 { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .return-viz .hint-line { margin-bottom: 16px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .bar-label { width: 140px; font-size: 12px; color: #374151; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--line); border-radius: 6px; height: 10px; position: relative; }
  .bar-fill { background: var(--slate); height: 100%; border-radius: 6px; }
  .bar-value { width: 56px; font-size: 12.5px; font-weight: 700; color: var(--navy); text-align: right; }

  footer {
    border-top: 1px solid var(--line); margin-top: 60px; padding: 24px 20px;
    text-align: center; font-size: 11.5px; color: var(--muted);
  }

  /* ---------- Portfolio screen (reuses result/table/bar patterns) ---------- */
  .portfolio-wrap { padding: 44px 0; }
  .portfolio-wrap h1 { font-size: 24px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
  .portfolio-summary-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;
    margin-top: 20px; margin-bottom: 32px;
  }
  .summary-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .summary-card .alloc-label { margin-bottom: 6px; }
  .summary-card .summary-value { font-size: 22px; font-weight: 800; color: var(--navy); }
  .summary-card .summary-value.green { color: var(--green); }
  .summary-card .summary-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .portfolio-section-title { font-size: 15px; font-weight: 700; color: var(--navy); margin: 0 0 4px; }

  @media (max-width: 640px) {
    table { font-size: 12px; }
    .nav-links { display: none; }
  }

  /* ---------- Language selector ---------- */
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang-select {
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--navy);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; cursor: pointer;
  }

  /* ---------- Portfolio: manual entry + demat connect ---------- */
  .portfolio-actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .btn-secondary {
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    color: var(--navy); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-secondary.active { border-color: var(--navy); background: var(--navy); color: #fff; }
  .btn-disabled-future {
    padding: 9px 16px; border-radius: 8px; border: 1px dashed var(--line); background: #fff;
    color: var(--muted); font-size: 13px; font-weight: 600; cursor: not-allowed;
  }
  .form-input-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-input-label { font-size: 12.5px; font-weight: 600; color: #374151; }
  .form-input {
    font-family: inherit; font-size: 13.5px; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: #1F2937; width: 100%;
  }
  .form-input:focus-visible { outline: 2px solid var(--slate); outline-offset: 1px; }
  .manual-entry-block { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .manual-entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 640px) { .manual-entry-grid { grid-template-columns: 1fr; } }
  .manual-entry-subhead { font-size: 14px; font-weight: 700; color: var(--navy); margin: 0 0 12px; }
  .holding-row-remove { font-size: 12px; color: #B3261E; background: none; border: none; cursor: pointer; font-weight: 600; padding: 0; margin-top: 2px; }
  .btn-add-holding { font-size: 12.5px; font-weight: 600; color: var(--slate); background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; width: 100%; margin-top: 6px; }
</style>
</head>

/* ---------------- Risk scoring (transparent, weighted) ----------------
   Each factor contributes points toward a 0–100 risk-capacity score.
   Scenario response is weighted 2x — a stated behavioural reaction
   under stress is a better predictor of risk tolerance than
   demographic proxies alone, so it dominates the other four inputs
   combined only slightly less than all of them together. This is a
   design choice, not a validated psychometric model — see disclaimer
   shown to the user.
   Max raw points: age20 + income20 + horizon20 + experience20 + scenario40 = 120
   Normalised to /100.
------------------------------------------------------------------- */
function computeRiskScore(p) {
  let pts = 0;
  if (p.age === "<30") pts += 20;
  else if (p.age === "30-45") pts += 14;
  else if (p.age === "45-60") pts += 8;
  else if (p.age === "60+") pts += 2;

  if (p.income === "<5L") pts += 2;
  else if (p.income === "5-10L") pts += 6;
  else if (p.income === "10-20L") pts += 12;
  else if (p.income === "20-50L") pts += 16;
  else if (p.income === "50L+") pts += 20;

  if (p.horizon === "<1y") pts += 2;
  else if (p.horizon === "1-3y") pts += 8;
  else if (p.horizon === "3-5y") pts += 14;
  else if (p.horizon === "5y+") pts += 20;

  if (p.experience === "beginner") pts += 4;
  else if (p.experience === "some") pts += 12;
  else if (p.experience === "experienced") pts += 20;

  if (p.scenario === "sell") pts += 4 * 2;
  else if (p.scenario === "hold") pts += 12 * 2;
  else if (p.scenario === "invest_more") pts += 20 * 2;

  const normalized = Math.round((pts / 120) * 100);
  let profile, allocation;
  if (normalized <= 40) { profile = "Risk-Averse"; allocation = "40–60%"; }
  else if (normalized <= 70) { profile = "Risk-Neutral"; allocation = "25–40%"; }
  else { profile = "Risk-Tolerant"; allocation = "15–30%"; }
  return { score: normalized, profile, allocation };
}

function bondsForProfile(profile) {
  if (profile === "Risk-Averse") return BONDS.filter(b => ["Low", "Low-Moderate"].includes(b.risk));
  if (profile === "Risk-Tolerant") return BONDS.filter(b => ["Moderate", "Moderate-High", "High"].includes(b.risk));
  return BONDS.filter(b => ["Low-Moderate", "Moderate", "Moderate-High"].includes(b.risk));
}

function portfolioMetrics() {
  const equityInvested = PORTFOLIO_EQUITY.reduce((s, h) => s + h.units * h.avgCost, 0);
  const equityCurrent = PORTFOLIO_EQUITY.reduce((s, h) => s + h.units * h.currentPrice, 0);
  const debtInvested = PORTFOLIO_DEBT.reduce((s, h) => s + h.invested, 0);
  const debtCurrent = PORTFOLIO_DEBT.reduce((s, h) => s + h.currentValue, 0);
  const totalInvested = equityInvested + debtInvested;
  const totalCurrent = equityCurrent + debtCurrent;
  const totalGain = totalCurrent - totalInvested;
  const totalReturnPct = totalInvested > 0 ? (totalGain / totalInvested) * 100 : 0;
  const equityPct = totalCurrent > 0 ? (equityCurrent / totalCurrent) * 100 : 0;
  const debtPct = totalCurrent > 0 ? (debtCurrent / totalCurrent) * 100 : 0;
  return { equityInvested, equityCurrent, debtInvested, debtCurrent, totalInvested, totalCurrent, totalGain, totalReturnPct, equityPct, debtPct };
}

function holdingsTableHtml(holdings, kind) {
  const rows = holdings.map(h => {
    const invested = kind === "equity" ? h.units * h.avgCost : h.invested;

    const gain = current - invested;
    const gainPct = invested > 0 ? (gain / invested) * 100 : 0;
    const gainClass = gain >= 0 ? "highlight" : "";
    const sign = gain >= 0 ? "+" : "";
    return `
      <tr>
        <td class="param-label">${esc(h.name)}<br><span class="hint-line" style="margin:0;">${esc(h.type)}</span></td>

        <td class="data-cell mono">${fmtINR(invested)}</td>
        <td class="data-cell mono">${fmtINR(current)}</td>
        <td class="data-cell mono ${gainClass}">${sign}${fmtINR(Math.abs(gain))}<span class="hl-tag mono">${sign}${gainPct.toFixed(2)}%</span></td>
      </tr>`;
  }).join("");

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>

}

function toggleCompareAlt(id) {
  if (compareAltIds.includes(id)) compareAltIds = compareAltIds.filter(x => x !== id);
  else if (compareAltIds.length < 4) compareAltIds = [...compareAltIds, id];
  render();
}

function renderCompareModeToggle() {
  return `
    <div class="field-block" style="margin-bottom:20px;">
      <div class="field-block-label">${t("compare_toggle_label")}</div>
      <div class="radio-group">
        <button class="radio-btn ${compareMode === "bonds" ? "selected" : ""}" onclick="setCompareMode('bonds')">${t("compare_bonds_only")}</button>
        <button class="radio-btn ${compareMode === "alternatives" ? "selected" : ""}" onclick="setCompareMode('alternatives')">${t("compare_vs_alt")}</button>
      </div>
    </div>`;
}

function renderCompareBondsOnly() {
  const bonds = BONDS.filter(b => compareIds.includes(b.id));

  if (bonds.length === 0) {
    return `
      <div class="compare-empty">
        <div class="t1">${t("compare_empty_t1")}</div>
        <div class="t2">${t("compare_empty_t2")}</div>
      </div>`;
  }

  const rows = [
    { label: t("row_issuer"), key: "issuer" },
    { label: t("row_rating"), key: "rating" },
    { label: t("row_coupon"), key: "coupon", fmt: (v) => v.toFixed(2) + "%" },
    { label: t("row_ytm"), key: "ytm", fmt: (v) => v.toFixed(2) + "%", highlight: "max" },
    { label: t("row_maturity"), key: "maturity", fmt: fmtDate, highlight: "minDate" },
    { label: t("row_min_inv"), key: "minInvestment", fmt: fmtINR },
    { label: t("row_freq"), key: "frequency" },
    { label: t("row_secured"), key: "secured" },
    { label: t("row_risk"), key: "risk" },
    { label: t("row_horizon"), key: "horizon" },
  ];

  const maxYtm = Math.max(...bonds.map(b => b.ytm));
  const minMaturity = Math.min(...bonds.map(b => new Date(b.maturity).getTime()));

  const isHighlighted = (row, bond) => {
    if (row.highlight === "max") return bond.ytm === maxYtm;
    if (row.highlight === "minDate") return new Date(bond.maturity).getTime() === minMaturity;
    return false;
  };

  const maxYield = Math.max(...bonds.map(b => b.ytm));

  const tableHtml = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Parameter</th>
            ${bonds.map(b => `
              <th class="issuer-col">
                ${esc(b.issuer)}
                <button class="remove-btn" onclick="toggleCompare('${b.id}')">${t("remove_btn")}</button>
              </th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td class="param-label">${row.label}</td>
              ${bonds.map(b => {
                const raw = b[row.key];
                const val = row.fmt ? row.fmt(raw) : raw;
                const hl = isHighlighted(row, b);
                return `<td class="data-cell mono ${hl ? "highlight" : ""}">${val}${hl ? `<span class="hl-tag mono">· ${t("highest_in_set")}</span>` : ""}</td>`;
              }).join("")}
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  const barsHtml = `
    <div class="return-viz">
      <h2>${t("return_viz_h2")}</h2>
      <p class="hint-line">${t("return_viz_hint")}</p>
      ${bonds.map(b => `
        <div class="bar-row">
          <div class="bar-label">${esc(b.issuer)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(b.ytm / maxYield) * 100}%"></div></div>
          <div class="bar-value mono">${b.ytm.toFixed(2)}%</div>
        </div>`).join("")}
    </div>`;

  return `
    ${tableHtml}
    ${barsHtml}`;
}

function renderCompareAlternatives() {
  const picker = `
    <div class="section-head-row" style="margin-bottom:10px;">
      <h2 style="margin:0;font-size:15px;">${t("compare_add_instruments")}</h2>
      <span class="sample-tag">${t("sample_tag")}</span>
    </div>
    <div class="radio-group" style="margin-bottom:24px;">
      ${BONDS.map(b => `
        <button class="radio-btn ${compareAltIds.includes(b.id) ? "selected" : ""}" onclick="toggleCompareAlt('${b.id}')">${esc(b.issuer)}</button>
      `).join("")}
      ${ALT_INSTRUMENTS.map(a => `
        <button class="radio-btn ${compareAltIds.includes(a.id) ? "selected" : ""}" onclick="toggleCompareAlt('${a.id}')">${esc(a.name)}</button>
      `).join("")}
    </div>`;

  const bondRows = altRowsFromBonds();
  const allInstruments = [...bondRows, ...ALT_INSTRUMENTS];
  const selected = allInstruments.filter(x => compareAltIds.includes(x.id));

  if (selected.length === 0) {
    return `
      ${picker}
      <div class="compare-empty">
        <div class="t1">${t("compare_alt_empty_t1")}</div>
        <div class="t2">${t("compare_alt_empty_t2")}</div>
      </div>`;
  }

  const rows = [
    { label: t("row_instrument_type"), key: "instrumentType" },
    { label: t("row_rate"), key: "rate", fmt: (v) => v.toFixed(2) + "%" },
    { label: t("row_return"), key: "returnPct", fmt: (v) => v.toFixed(2) + "%", highlight: "max" },
    { label: t("row_tenure"), key: "tenure" },
    { label: t("row_min_inv"), key: "minInvestment", fmt: fmtINR },
    { label: t("row_risk"), key: "risk" },
    { label: t("row_liquidity"), key: "liquidity" },
    { label: t("row_tax"), key: "tax" },
  ];

  const maxReturn = Math.max(...selected.map(x => x.returnPct));
  const isHighlighted = (row, x) => row.highlight === "max" && x.returnPct === maxReturn;

  const tableHtml = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Parameter</th>
            ${selected.map(x => `
              <th class="issuer-col">
                ${esc(x.name)}
                <button class="remove-btn" onclick="toggleCompareAlt('${x.id}')">${t("remove_btn")}</button>
              </th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td class="param-label">${row.label}</td>
              ${selected.map(x => {
                const raw = x[row.key];
                const val = row.fmt ? row.fmt(raw) : raw;
                const hl = isHighlighted(row, x);
                return `<td class="data-cell mono ${hl ? "highlight" : ""}">${val}${hl ? `<span class="hl-tag mono">· ${t("highest_in_set")}</span>` : ""}</td>`;
              }).join("")}
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;

  const maxYield = Math.max(...selected.map(x => x.returnPct));
  const barsHtml = `
    <div class="return-viz">
      <h2>${t("return_viz_alt_h2")}</h2>
      <p class="hint-line">${t("return_viz_alt_hint")}</p>
      ${selected.map(x => `
        <div class="bar-row">
          <div class="bar-label">${esc(x.name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(x.returnPct / maxYield) * 100}%"></div></div>
          <div class="bar-value mono">${x.returnPct.toFixed(2)}%</div>
        </div>`).join("")}
    </div>`;

  return `
    ${picker}
    ${tableHtml}
    ${barsHtml}`;
}

function renderCompare() {
  const body = compareMode === "alternatives" ? renderCompareAlternatives() : renderCompareBondsOnly();
  const hint = compareMode === "alternatives" ? t("compare_hint_alt") : t("compare_hint_bonds");

  return `
    <div class="compare-wrap">
      <h1>${t("compare_h1")}</h1>
      <p class="hint-line">${hint}</p>
      ${renderCompareModeToggle()}
      ${body}
    </div>`;
}

/* ---------------- Bond Detail Modal ---------------- */
function openDetail(id) {
  detailBondId = id;
  const b = BONDS.find(x => x.id === id);
  const inCompare = compareIds.includes(id);
  document.getElementById("detailContent").innerHTML = `
    <div class="modal-top">
      <div>
        <div class="modal-issuer">${esc(b.issuer)}</div>
        <div class="modal-sub">${esc(b.type)} · ${b.seniority !== "N/A" ? b.seniority : "Sovereign"}</div>
      </div>
      <span class="rating-badge mono">${b.rating}</span>
    </div>

    <div class="modal-hero-grid">
      <div>
        <div class="field-label">${t("fld_ytm")} <button class="learn-more" onclick="openGlossary('ytm')">${t("learn_more")}</button></div>
        <div class="modal-hero-val mono" style="color:var(--green)">${b.ytm.toFixed(2)}%</div>
      </div>
      <div>
        <div class="field-label">${t("fld_coupon")} <button class="learn-more" onclick="openGlossary('coupon')">${t("learn_more")}</button></div>
        <div class="modal-hero-val mono" style="color:var(--navy)">${b.coupon.toFixed(2)}%</div>
      </div>
    </div>

    <div class="modal-field-grid">
      ${fieldHtml(t("fld_maturity_date"), fmtDate(b.maturity), "maturity")}
      ${fieldHtml(t("fld_face_value"), fmtINR(b.faceValue), "faceValue")}
      ${fieldHtml(t("fld_min_inv"), fmtINR(b.minInvestment))}
      ${fieldHtml(t("fld_pay_freq"), b.frequency)}
      ${fieldHtml(t("fld_secured_unsecured"), b.secured)}
      ${fieldHtml(t("fld_seniority"), b.seniority)}
      ${fieldHtml(t("fld_risk"), b.risk)}
      ${fieldHtml(t("fld_horizon"), b.horizon)}
    </div>

    <div class="disclaimer">${t("modal_disclaimer")}</div>

    <div class="modal-actions">
      <button class="btn-invest">${t("modal_continue_invest")}</button>
      <button class="btn-compare ${inCompare ? "active" : ""}" onclick="toggleCompare('${b.id}'); openDetail('${b.id}')">${inCompare ? t("modal_in_compare") : t("modal_add_compare")}</button>
    </div>`;
  document.getElementById("detailOverlay").classList.add("open");
}

function closeDetail(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("detailOverlay").classList.remove("open");
  render();
}

/* ---------------- Glossary Modal ---------------- */
function openGlossary(termId) {
  const g = (GLOSSARY_T[currentLang] && GLOSSARY_T[currentLang][termId]) || GLOSSARY_T.en[termId];
  document.getElementById("glossaryContent").innerHTML = `
    <div class="sheet-handle"></div>
    <h3 class="glossary-title">${g.title}</h3>
    <p class="glossary-body">${g.what}</p>
    <div class="glossary-why">
      <div class="glossary-why-label">${t("glossary_why")}</div>
      <p class="glossary-why-body">${g.why}</p>
    </div>
    ${g.example ? `<div class="glossary-why">
      <div class="glossary-why-label">${t("glossary_example")}</div>
      <p class="glossary-why-body">${g.example}</p>
    </div>` : ""}
    <button class="btn-gotit" onclick="closeGlossary()">${t("glossary_got_it")}</button>`;
  document.getElementById("glossaryOverlay").classList.add("open");
}

function closeGlossary(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("glossaryOverlay").classList.remove("open");
}

/* ---------------- Render dispatch ---------------- */
function render() {
  renderNav();
  const root = document.getElementById("screenRoot");
  if (screen === "explore") root.innerHTML = renderExplore();
  else if (screen === "profile") root.innerHTML = renderProfile();
  else if (screen === "result") root.innerHTML = renderResult();
  else if (screen === "compare") root.innerHTML = renderCompare();
  else if (screen === "portfolio") root.innerHTML = renderPortfolio();
}

render();
</script>
</body>
</html>
